services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pizza_backend
    volumes:
      - ./backend:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_DB=pizzaria_db
      - POSTGRES_USER=pizzaria_user
      - POSTGRES_PASSWORD=pizzaria_password
      - DATABASE_URL=postgresql://pizzaria_user:pizzaria_password@db:5432/pizzaria_db
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - DEBUG=True
      - SECRET_KEY=your-secret-key-here
      - ALLOWED_HOSTS=localhost,127.0.0.1
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15
    container_name: pizza_db
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: pizzaria_db
      POSTGRES_USER: pizzaria_user
      POSTGRES_PASSWORD: pizzaria_password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pizzaria_user -d pizzaria_db"]
      timeout: 5s
      retries: 10
      interval: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pizza_frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    command: npm run build

  nginx:
    image: nginx:alpine
    container_name: nginx_server_pizza
    ports:
      - "80:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/usr/share/nginx/html/static
      - media_volume:/usr/share/nginx/html/media
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  static_volume:
  media_volume:
